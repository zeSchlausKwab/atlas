[package]
name = "atlas-osm-import"
version = "0.1.0"
edition = "2021"
default-run = "atlas-osm-import"

[dependencies]
atlas-routing = { path = "../routing" }
osmpbfreader = { version = "0.19", features = ["serde"] }
serde_json = "1"
memmap2 = "0.9"
tempfile = "3"
rusqlite = { version = "0.37", features = ["bundled", "trace"] }
flate2 = "1"
serde = { version = "1", features = ["derive"] }
