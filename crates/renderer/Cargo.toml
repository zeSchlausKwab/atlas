[package]
name = "atlas-renderer"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
atlas-routing = { path = "../routing" }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde_json = "1"
earcutr = "0.4"

[dependencies.web-sys]
version = "0.3"
features = ["HtmlCanvasElement", "WebGl2RenderingContext", "WebGlBuffer", "WebGlProgram", "WebGlShader", "WebGlUniformLocation", "WebGlVertexArrayObject"]
