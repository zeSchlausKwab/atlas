[package]
name = "soy-fips-demo"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
fips-core = { package = "nvpn-fips-core", version = "=0.4.95" }
fips-tcp = { package = "nvpn-fips-tcp", version = "=0.2.5" }
fips-tcp-endpoint = { package = "nvpn-fips-tcp-endpoint", version = "=0.2.30" }
hex = "0.4"
base64 = "=0.22.1"
rmp-serde = "=1.3.0"
serde_bytes = "=0.11.19"
secp256k1 = "=0.29.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.1"

[target.'cfg(not(target_os = "android"))'.dependencies]
rusqlite = { version = "=0.37.0", features = ["bundled"] }

[profile.release]
strip = true
lto = "thin"

[workspace]
