plugins { id 'com.android.application' }
android {
    namespace 'soy.napplet.fipsdemo'
    compileSdk 36
    defaultConfig {
        applicationId 'org.atlas.nativeviewer'
        minSdk 30
        targetSdk 36
        versionCode 4
        testInstrumentationRunner 'soy.napplet.fipsdemo.GestureInstrumentation'
        versionName '0.5.0-public-fips'
        ndk { abiFilters 'arm64-v8a' }
    }
    sourceSets { main { jniLibs.srcDirs = ['build/native-libs']; assets.srcDirs = ['build/viewer-assets'] } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
